    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        } else {
        document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
